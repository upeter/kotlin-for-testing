spring:
  application:
    name: conference-website
  datasource:
    url: jdbc:h2:mem:conference;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false
  jmx:
    enabled: false

